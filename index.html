<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gündelik Defter - Yapılacaklar Listesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment: { 100: '#FAF7F0', 200: '#F4EFE0', 300: '#E8DFCA', 400: '#D4C5A9' },
                        ink: { light: '#4A3E3D', DEFAULT: '#2B2120', dark: '#1C1615' },
                        brass: { light: '#E6C687', DEFAULT: '#C5A059', dark: '#9A7B38' },
                        rust: '#8B3A2B',
                        sage: '#4A5D4E',
                    },
                    fontFamily: {
                        heading: ['Playfair Display', 'serif'],
                        body: ['Cormorant Garamond', 'serif'],
                        mono: ['Courier Prime', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #2B2120; background-image: radial-gradient(#3D302F 1px, transparent 0); background-size: 24px 24px; }
        .parchment-card { background-color: #F4EFE0; background-image: radial-gradient(#E8DFCA 0.75px, transparent 0); background-size: 16px 16px; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(139, 90, 43, 0.15); }
        .dark .parchment-card { background-color: #1C1615; background-image: radial-gradient(#2B2120 0.75px, transparent 0); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), inset 0 0 80px rgba(0, 0, 0, 0.6); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(197, 160, 89, 0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 3px; }
        .antique-checkbox { appearance: none; width: 20px; height: 20px; border: 2px solid #C5A059; border-radius: 2px; background-color: transparent; cursor: pointer; position: relative; transition: all 0.2s ease; }
        .antique-checkbox:checked { background-color: #8B3A2B; border-color: #8B3A2B; }
        .antique-checkbox:checked::after { content: '✓'; position: absolute; color: #F4EFE0; font-size: 14px; font-weight: bold; top: -2px; left: 3px; }
        .modal-backdrop { background-color: rgba(28, 22, 21, 0.75); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="font-body text-ink dark:text-parchment-200 min-h-screen py-8 px-4 sm:px-6 transition-colors duration-300">

    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b-2 border-brass/40 relative">
            <div class="text-center md:text-left mb-4 md:mb-0">
                <div class="flex items-center justify-center md:justify-start gap-3 mb-1">
                    <i class="fa-solid fa-feather-pointed text-2xl text-brass"></i>
                    <h1 class="font-heading text-3xl sm:text-4xl font-bold tracking-wider text-parchment-100 dark:text-brass-light uppercase">Gündelik Defter</h1>
                </div>
                <p class="font-mono text-xs text-brass/80 tracking-widest uppercase">Planlar & Görev Takibi</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block font-mono text-xs text-parchment-300 border-r border-brass/30 pr-4">
                    <div id="current-date" class="font-bold text-brass-light">1 Kasım 2026</div>
                    <div id="current-day" class="text-parchment-400">Pazar</div>
                </div>
                <button id="theme-toggle" class="p-2.5 rounded-full border border-brass/50 bg-ink-light text-brass hover:bg-brass hover:text-ink transition-all duration-300">
                    <i class="fa-solid fa-moon text-lg" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <main class="parchment-card rounded-lg p-6 sm:p-8 border-2 border-brass/60 relative overflow-hidden">
            <section class="mb-8 p-4 sm:p-6 border border-brass/30 rounded bg-parchment-100/50 dark:bg-ink-dark/40">
                <h2 class="font-heading text-xl font-bold mb-4 text-ink dark:text-brass-light flex items-center gap-2">
                    <i class="fa-solid fa-pen-quill text-brass text-base"></i> Yeni Görev Yaz
                </h2>
                <form id="todo-form" class="space-y-4">
                    <div>
                        <input type="text" id="todo-input" placeholder="Yapılacak görevi yazın..." required 
                            class="w-full bg-parchment-200 dark:bg-ink border-b-2 border-brass/50 focus:border-brass px-3 py-2 text-lg font-body focus:outline-none placeholder-ink-light/50 dark:placeholder-parchment-400/50 transition-colors">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                        <div>
                            <label class="block font-mono text-xs uppercase tracking-wider text-brass-dark dark:text-brass mb-1">Kategori</label>
                            <select id="category-select" class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-2.5 py-1.5 font-body text-sm focus:outline-none">
                                <option value="Genel">Genel</option>
                                <option value="İş">İş</option>
                                <option value="Kişisel">Kişisel</option>
                                <option value="Spor">Spor</option>
                                <option value="Üniversite">Üniversite</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-mono text-xs uppercase tracking-wider text-brass-dark dark:text-brass mb-1">Öncelik Seviyesi</label>
                            <select id="priority-select" class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-2.5 py-1.5 font-body text-sm focus:outline-none">
                                <option value="Düşük">Düşük Öncelik</option>
                                <option value="Orta" selected>Orta Öncelik</option>
                                <option value="Yüksek">Yüksek Öncelik</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-mono text-xs uppercase tracking-wider text-brass-dark dark:text-brass mb-1">Son Tarih</label>
                            <input type="date" id="date-input" class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-2.5 py-1.5 font-mono text-xs focus:outline-none">
                        </div>
                    </div>
                    <div class="text-right pt-2">
                        <button type="submit" class="bg-brass hover:bg-brass-dark text-ink-dark font-heading font-bold px-6 py-2 rounded shadow transition-all duration-200 flex items-center gap-2 ml-auto">
                            <i class="fa-solid fa-plus text-xs"></i> Listeye Ekle
                        </button>
                    </div>
                </form>
            </section>

            <section class="mb-6">
                <div class="flex justify-between items-center mb-1 font-mono text-xs text-brass-dark dark:text-brass">
                    <span>Tamamlanma Oranı</span>
                    <span id="progress-text">0 / 0 (%0)</span>
                </div>
                <div class="w-full bg-parchment-300 dark:bg-ink-light h-2.5 rounded-full overflow-hidden border border-brass/30">
                    <div id="progress-bar" class="bg-rust h-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </section>

            <section class="flex flex-wrap justify-between items-center gap-3 mb-6 pb-4 border-b border-brass/30 font-mono text-xs">
                <div class="flex items-center gap-1 bg-parchment-300/50 dark:bg-ink-light/50 p-1 rounded border border-brass/20">
                    <button class="filter-btn active px-3 py-1 rounded transition-colors" data-filter="all">Tümü</button>
                    <button class="filter-btn px-3 py-1 rounded transition-colors" data-filter="active">Yapılacaklar</button>
                    <button class="filter-btn px-3 py-1 rounded transition-colors" data-filter="completed">Tamamlananlar</button>
                </div>
                <div class="flex items-center gap-2">
                    <select id="filter-category" class="bg-parchment-200 dark:bg-ink border border-brass/30 rounded px-2 py-1 focus:outline-none">
                        <option value="all">Tüm Kategoriler</option>
                        <option value="Genel">Genel</option>
                        <option value="İş">İş</option>
                        <option value="Kişisel">Kişisel</option>
                        <option value="Spor">Spor</option>
                        <option value="Üniversite">Üniversite</option>
                    </select>
                    <select id="sort-by" class="bg-parchment-200 dark:bg-ink border border-brass/30 rounded px-2 py-1 focus:outline-none">
                        <option value="created">Ekleme Sırası</option>
                        <option value="date">Son Tarihe Göre</option>
                        <option value="priority">Önceliğe Göre</option>
                    </select>
                </div>
            </section>

            <section>
                <ul id="todo-list" class="space-y-3 max-h-[450px] overflow-y-auto pr-2 custom-scrollbar"></ul>
                <div id="empty-state" class="hidden text-center py-12 text-brass/70 italic font-heading">
                    <i class="fa-solid fa-scroll text-3xl mb-2 block text-brass/40"></i>
                    Henüz eklenmiş bir görev bulunmuyor.
                </div>
            </section>
        </main>
    </div>

    <div id="edit-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
        <div class="parchment-card rounded-lg p-6 max-w-md w-full border-2 border-brass shadow-2xl relative">
            <h3 class="font-heading text-xl font-bold mb-4 text-ink dark:text-brass-light border-b border-brass/30 pb-2">Görevi Düzenle</h3>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block font-mono text-xs uppercase text-brass-dark dark:text-brass mb-1">Görev Metni</label>
                    <input type="text" id="edit-text" required class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-3 py-2 font-body text-base focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-mono text-xs uppercase text-brass-dark dark:text-brass mb-1">Kategori</label>
                        <select id="edit-category" class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-2.5 py-1.5 font-body text-sm focus:outline-none">
                            <option value="Genel">Genel</option>
                            <option value="İş">İş</option>
                            <option value="Kişisel">Kişisel</option>
                            <option value="Spor">Spor</option>
                            <option value="Üniversite">Üniversite</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-mono text-xs uppercase text-brass-dark dark:text-brass mb-1">Öncelik</label>
                        <select id="edit-priority" class="w-full bg-parchment-200 dark:bg-ink border border-brass/40 rounded px-2.5 py-1.5 font-body text-sm focus:outline-none">
                            <option value="Düşük">Düşük</option>
                            <option value="Orta">Orta</option>
                            <option value="Yüksek">Yüksek</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-mono text-xs uppercase text-brass-dark dark:text-brass mb-1">Son Tarih</label>
                    <input type="date" id="edit-date" class="w-full bg-parchment-200 dark:bg-ink border border
